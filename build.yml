name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: bash setup.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Sign with fixed key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign --ks worktable-key.p12 --ks-type PKCS12 --ks-pass pass:worktable123 --ks-key-alias worktable --out worktable.apk android/app/build/outputs/apk/debug/app-debug.apk
          $APKSIGNER verify --print-certs worktable.apk
      - uses: actions/upload-artifact@v4
        with:
          name: worktable-apk
          path: worktable.apk
