 'sy2':'σ<sup>2</sup><sub><i>y</i></sub>','sy':'σ<sub><i>y</i></sub>','ssy2':'s<sup>2</sup><sub><i>y</i></sub>','ssy':'s<sub><i>y</i></sub>',
 'Sx':'Σ<i>x</i>','Sx2':'Σ<i>x</i><sup>2</sup>','Sy':'Σ<i>y</i>','Sy2':'Σ<i>y</i><sup>2</sup>','Sxy':'Σ<i>xy</i>','Sx3':'Σ<i>x</i><sup>3</sup>','Sx2y':'Σ<i>x</i><sup>2</sup><i>y</i>','Sx4':'Σ<i>x</i><sup>4</sup>',
 'minx':'min(<i>x</i>)','maxx':'max(<i>x</i>)','miny':'min(<i>y</i>)','maxy':'max(<i>y</i>)','Q1':'Q<sub>1</sub>','Med':'Med','Q3':'Q<sub>3</sub>',
 'a':'<i>a</i>','b':'<i>b</i>','c':'<i>c</i>','r':'<i>r</i>'
};

/* =====================================================================
   PARSER & EVALUATOR
   Items in a line: string tokens or template objects {k,s:[lines]}
   ===================================================================== */
const isTpl=x=>x!==null&&typeof x==='object'&&!Array.isArray(x)&&x.k;
const ARITY={'log(':[1,2],'Pol(':[2,2],'Rec(':[2,2],'RanInt#(':[2,2],'GCD(':[2,2],'LCM(':[2,2],'∫(':[3,4],'d/dx(':[2,3],'Σ(':[3,3],
  'Dot(':[2,2],'Angle(':[2,2],'Identity(':[1,1],'Min(':[1,1],'Max(':[1,1],'Mean(':[1,1],'Sum(':[1,1]};
const BINDX=new Set(['∫(','d/dx(','Σ(']);
const isFunc=t=>typeof t==='string'&&t.length>1&&t.endsWith('(')&&t!=='^('&&t!=='ˣ√(';
const POSTFIX=new Set(['²','³','⁻¹','!','%','ᴼ','ʳ','ᵍ','▸r∠θ','▸a+bi','▸t','SE:xh','SE:yh','SE:xh1','SE:xh2']);
const isPost=t=>typeof t==='string'&&(POSTFIX.has(t)||t.startsWith('E:')||t.startsWith('V:'));
const MATN=['MatA','MatB','MatC','MatD','MatAns'],VCTN=['VctA','VctB','VctC','VctD','VctAns'];
const HEXD={hA:10,hB:11,hC:12,hD:13,hE:14,hF:15};
const SSCOL='ABCDE';

const PARENS=[];
function sexaNode(n){
  if(!n)return false;
  if(n.t==='num')return !!n.dms;
  if(n.t==='neg')return sexaNode(n.a);
  if(n.t!=='bin')return false;
  if(n.op==='+'||n.op==='−')return sexaNode(n.a)||sexaNode(n.b);
  if(n.op==='×')return sexaNode(n.a)!==sexaNode(n.b);
  if(n.op==='÷')return sexaNode(n.a)&&!sexaNode(n.b);
  return false;
}
function parseExpr(items,opts={}){
  const ln=items;let p=0;
  const peek=()=>ln[p];
  const err=(q=p)=>{throw {k:'Syntax ERROR',ln,pos:q}};
  const isDig=t=>typeof t==='string'&&/^[0-9.]$/.test(t);
  const isBDig=t=>typeof t==='string'&&(/^[0-9]$/.test(t)||t in HEXD);
  const base=S.mode==='BASE'?(S.app.base||10):10;
  const ss=S.mode==='SS';
  const sub=(l)=>{if(!l.length)throw {k:'Syntax ERROR',ln:l,pos:0};return parseExpr(l,{}).ast};
  function starts(t){
    if(t===undefined)return false;
    if(isTpl(t))return t.k!=='pow';
    if(typeof t!=='string')return false;
    return isDig(t)||t==='ᴇ'||VARS.includes(t)||t==='π'||t==='e'||t==='i'||t==='Ans'||t==='PreAns'||t==='Ran#'||t==='('||isFunc(t)||
      t.startsWith('K:')||t.startsWith('SV:')||MATN.includes(t)||VCTN.includes(t)||t in HEXD||/^B[dhbo]$/.test(t)||t==='$';
  }
  function number(){
    const st=p;let s='';
    if(S.mode==='BASE'){
      let b=base;
      if(/^B[dhbo]$/.test(peek())){b={Bd:10,Bh:16,Bb:2,Bo:8}[ln[p++]]}
      let v=0,any=false;
      while(isBDig(peek())){const t=ln[p++];const d=t in HEXD?HEXD[t]:+t;if(d>=b)err(p-1);v=v*b+d;any=true;if(v>2**32)merr()}
      if(!any)err(st);
      // interpret as 32-bit two's complement for non-decimal
      if(b!==10){if(v>=2**32)merr();if(v>=2**31)v-=2**32}else if(v>2**31)merr();
      return {t:'num',v};
    }
    while(isDig(peek()))s+=ln[p++];
    if((s.match(/\./g)||[]).length>1||s==='.')err(st);
    if(peek()==='ᴇ'){p++;let neg=false;if(peek()==='-'||peek()==='−'){neg=true;p++}let e='';while(typeof peek()==='string'&&/^[0-9]$/.test(peek()))e+=ln[p++];if(e==='')err();
      return {t:'num',v:parseFloat((s===''?'1':s)+'e'+(neg?'-':'')+e)}}
    if(s==='')err(st);
    return {t:'num',v:parseFloat(s)};
  }
  function close(){if(peek()===')')p++;else if(peek()!==undefined&&peek()!=='='&&peek()!==':'&&peek()!==',')err()}
  function cellRef(){
    const st=p;let ac=false,ar=false;if(peek()==='$'){ac=true;p++}
    const c=peek();if(typeof c!=='string'||!SSCOL.includes(c)||c.length!==1)err(st);p++;
    if(peek()==='$'){ar=true;p++}
    let r='';while(typeof peek()==='string'&&/^[0-9]$/.test(peek()))r+=ln[p++];
    if(!r){if(ac||ar)err(st);p=st;return null}
    const row=+r;if(row<1||row>45)err(st);
    return {t:'cell',c:SSCOL.indexOf(c),r:row-1,ac,ar};
  }
  function primary(){
    const t=peek();
    if(t===undefined)err();
    if(isTpl(t)){p++;
      const s=t.s;
      switch(t.k){
        case 'frac':return {t:'bin',op:'÷',a:sub(s[0]),b:sub(s[1]),fr:1};
        case 'mixed':return {t:'mixed',a:sub(s[0]),b:sub(s[1]),c:sub(s[2])};
        case 'sqrt':return {t:'fn',f:'√(',args:[sub(s[0])]};
        case 'root':return {t:'bin',op:'root',a:sub(s[0]),b:sub(s[1])};
        case 'pe':return {t:'fn',f:'e^(',args:[sub(s[0])]};
        case 'p10':return {t:'fn',f:'10^(',args:[sub(s[0])]};
        case 'logab':return s[0].length?{t:'fn',f:'log(',args:[sub(s[0]),sub(s[1])]}:{t:'fn',f:'log(',args:[sub(s[1])]};
        case 'abs':return {t:'fn',f:'Abs(',args:[sub(s[0])]};
        case 'integ':return {t:'fn',f:'∫(',args:[sub(s[0]),sub(s[1]),sub(s[2])]};
        case 'deriv':return {t:'fn',f:'d/dx(',args:[sub(s[0]),sub(s[1])]};
        case 'sum':return {t:'fn',f:'Σ(',args:[sub(s[0]),sub(s[1]),sub(s[2])]};
      }
      err(p-1);
    }
    if(ss&&(t==='$'||(SSCOL.includes(t)&&t.length===1))){const c=cellRef();if(c)return c}
    if(isDig(t)||t==='ᴇ'||(S.mode==='BASE'&&(t in HEXD||/^B[dhbo]$/.test(t)))){
      let n=number();
      if(peek()==='°'){p++;let v=n.v,f=60;for(let k=0;k<2&&isDig(peek());k++){const m=number();if(peek()!=='°')err();p++;v+=m.v/f;f*=60}n={t:'num',v,dms:1}}
      return n;
    }
    if(VARS.includes(t)||t==='Ans'||t==='PreAns'){p++;return {t:'var',n:t}}
    if(t==='π'){p++;return {t:'num',v:Math.PI}}
    if(t==='e'){p++;return {t:'num',v:Math.E}}
    if(t==='i'){p++;if(S.mode!=='CMPLX')err(p-1);return {t:'num',v:{cx:1,re:0,im:1}}}
    if(t.startsWith('K:')){p++;return {t:'num',v:CONSTFLAT[+t.slice(2)][2]}}
    if(t.startsWith('SV:')){p++;return {t:'stat',n:t.slice(3)}}
    if(MATN.includes(t)){p++;return {t:'mat',n:t}}
    if(VCTN.includes(t)){p++;return {t:'vct',n:t}}
    if(t==='Ran#'){p++;return {t:'ran'}}
    if(t==='('){p++;const e=expr();close();return e&&e.imp?Object.assign({},e,{imp:0}):e}
    if(isFunc(t)){p++;
      const args=[];
      if(['Min(','Max(','Mean(','Sum('].includes(t)){const a=cellRef();if(!a||peek()!==':')err();p++;const b=cellRef();if(!b)err();args.push({t:'range',a,b})}
      else{args.push(expr());while(peek()===','){p++;args.push(expr())}}
      close();const [mn,mx]=ARITY[t]||[1,1];if(args.length<mn||args.length>mx)err();return {t:'fn',f:t,args}}
    err();
  }
  function power(){
    let b=primary();
    for(;;){const t=peek();
      if(isPost(t)){p++;b={t:'post',op:t,a:b}}
      else if(isTpl(t)&&t.k==='pow'){p++;b={t:'bin',op:'^',a:b,b:sub(t.s[0])}}
      else if(t==='^('||t==='ˣ√('){p++;const e=expr();close();b={t:'bin',op:t==='^('?'^':'root',a:b,b:e}}
      else break}
    return b;
  }
  function frac(){const a=power();if(peek()!=='⌟')return a;p++;const b=power();if(peek()!=='⌟')return {t:'bin',op:'÷',a,b,fr:1};p++;const c=power();return {t:'mixed',a,b,c}}
  function unary(){if(peek()==='-'||(peek()==='−'&&opts.lead!==false)){p++;return {t:'neg',a:unary()}}if(peek()==='Not('||peek()==='Neg('){}return frac()}
  function impl(){const s0=p;let a=unary();while(starts(peek())){a={t:'bin',op:'×',a,b:unary(),imp:1,s0,s1:p}}return a}
  function perm(){let a=impl();while(peek()==='nP'||peek()==='nC'||peek()==='∠'){const op=ln[p++];a={t:'bin',op,a,b:impl()}}return a}
  function mul(){let a=perm();for(;;){const t=peek();if(t==='×'||t==='÷'||t==='•'){p++;const b=perm();if(t==='÷'&&b.imp&&PARENS.length<64)PARENS.push({ln,a:b.s0,b:b.s1});a={t:'bin',op:t,a,b}}else break}return a}
  function add(){let a=mul();while(peek()==='+'||peek()==='−'){const op=ln[p++];a={t:'bin',op,a,b:mul()}}return a}
  function andx(){let a=add();while(peek()==='and'){p++;a={t:'bin',op:'and',a,b:add()}}return a}
  function expr(){let a=andx();while(peek()==='or'||peek()==='xor'||peek()==='xnor'){const op=ln[p++];a={t:'bin',op,a,b:andx()}}return a}
  if(!ln.length)err(0);
  const r={ast:expr()};
  if(peek()==='='){if(!opts.allowEq)err();p++;r.rhs=expr()}
  if(opts.multi&&peek()===':'){p++;r.next=p;return r}
  if(p<ln.length)err();
  return r;
}
/* split top-level statements on ':' */
function parseStatements(items,allowEq){
  const out=[];let st=0;
  for(let i=0;i<=items.length;i++){
    if(i===items.length||items[i]===':'){
      const seg=items.slice(st,i);
      try{out.push(parseExpr(seg,{allowEq}))}catch(e){if(e.ln===seg){e.ln=items;e.pos+=st}throw e}
      for(const q of PARENS)if(q.ln===seg){q.ln=items;q.a+=st;q.b+=st}
      st=i+1;
    }
  }
  return out;
}

/* ---------- evaluator ---------- */
let EVCOUNT=0;
function ev(n,env){const v=ev0(n,env);return chk(v)}
function evR(n,env){const v=ev(n,env);if(typeof v!=='number'){if(isC(v)&&S.mode==='CMPLX')merr();if(isM(v)||isV(v))derr();merr()}return v}
function b32(v){if(!isFinite(v))merr();v=Math.trunc(v);if(v<-(2**31)||v>2**31-1)merr();return v}
function ev0(n,env){
  switch(n.t){
    case 'num':return n.v;
    case 'var':if(n.n in env)return env[n.n];if(n.n==='Ans')return S.ans;if(n.n==='PreAns')return S.preAns;return S.vars[n.n];
    case 'mat':{const m=S.mats[n.n];if(!m)throw ERR('Variable ERROR');return mkMat(m.map(r=>r.slice()))}
    case 'vct':{const v=S.vcts[n.n];if(!v)throw ERR('Variable ERROR');return mkVec(v.slice())}
    case 'stat':return statVar(n.n);
    case 'cell':return env.cell?env.cell(n):merr();
    case 'ran':return Math.floor(Math.random()*1000)/1000;
    case 'neg':{const v=vNeg(ev(n.a,env));return S.mode==='BASE'?b32(v):v}
    case 'mixed':{const a=evR(n.a,env),b=evR(n.b,env),c=evR(n.c,env);if(c===0)merr();if(!isInt(a)||!isInt(b)||!isInt(c))throw ERR('Syntax ERROR');return a<0?a-b/c:a+b/c}
    case 'post':return post(n.op,ev(n.a,env));
    case 'bin':{
      const a=ev(n.a,env),b=ev(n.b,env);
      if(S.mode==='BASE'){
        const x=b32(reqReal(a)),y=b32(reqReal(b));
        switch(n.op){case '+':return b32(x+y);case '−':return b32(x-y);case '×':return b32(x*y);case '÷':if(y===0)merr();return b32(x/y);
          case 'and':return x&y;case 'or':return x|y;case 'xor':return x^y;case 'xnor':return ~(x^y)}
        throw ERR('Syntax ERROR');
      }
      switch(n.op){
        case '+':return vAdd(a,b);case '−':return vAdd(a,b,-1);case '×':return vMul(a,b);case '÷':return vDiv(a,b);
        case '•':{if(!isV(a)||!isV(b)||a.vec.length!==b.vec.length)derr();return a.vec.reduce((s,v,i)=>s+v*b.vec[i],0)}
        case '^':return vPow(a,b);
        case 'root':{const k=reqReal(a);if(k===0)merr();if(isC(b))return cPow(b,1/k);const x=reqReal(b);if(x<0){if(isInt(k)&&Math.round(k)%2!==0)return -Math.pow(-x,1/k);if(S.mode==='CMPLX')return cPow(x,1/k);merr()}return rPow(x,1/k)}
        case 'nP':return nPr(reqReal(a),reqReal(b));case 'nC':return nCr(reqReal(a),reqReal(b));
        case '∠':{if(S.mode!=='CMPLX')throw ERR('Syntax ERROR');return cPolar(reqReal(a),toRad(reqReal(b)))}
        case 'and':case 'or':case 'xor':case 'xnor':throw ERR('Syntax ERROR');
      }
    }
    case 'fn':return callFn(n,env);
  }
  merr();
}
function post(op,a){
  switch(op){
    case '²':return vMul(a,a);
    case '³':return vMul(vMul(a,a),a);
    case '⁻¹':if(isM(a))return mkMat(mInv(a.mat));if(isV(a))derr();return vDiv(1,a);
    case '!':return fact(reqReal(a));
    case '%':return vDiv(a,100);
    case 'ᴼ':return S.setup.angle==='D'?a:fromRad(reqReal(a)*Math.PI/180);
    case 'ʳ':return fromRad(reqReal(a));
    case 'ᵍ':return fromRad(reqReal(a)*Math.PI/200);
    case '▸r∠θ':case '▸a+bi':return a;
    case '▸t':{const s=statCalc();return (reqReal(a)-s.xbar)/s.sx}
    case 'SE:xh':case 'SE:yh':case 'SE:xh1':case 'SE:xh2':return statEst(op.slice(3),reqReal(a));
  }
  if(op.startsWith('E:'))return vMul(a,ENGP[op.slice(2)]);
  if(op.startsWith('V:'))return CONVFLAT[+op.slice(2)].f(reqReal(a));
  merr();
}
function callFn(n,env){
  const f=n.f;
  if(BINDX.has(f)){
    const body=n.args[0];
    const F=x=>{if(++EVCOUNT>500000)throw ERR('Time Out');return evR(body,Object.assign({},env,{x}))};
    if(f==='∫('){const a=evR(n.args[1],env),b=evR(n.args[2],env);EVCOUNT=0;return round13(integrate(F,a,b))}
    if(f==='d/dx('){const a=evR(n.args[1],env);EVCOUNT=0;const d=deriv(F,a);return Math.abs(d)<1e-10?0:Number(d.toPrecision(11))}
    if(f==='Σ('){let a=evR(n.args[1],env),b=evR(n.args[2],env);if(!isInt(a)||!isInt(b)||a>b||b-a>1e6)merr();a=Math.round(a);b=Math.round(b);EVCOUNT=0;let s=0;for(let i=a;i<=b;i++)s+=F(i);return s}
  }
  if(['Min(','Max(','Mean(','Sum('].includes(f)){
    const rg=n.args[0];const vals=env.range?env.range(rg):merr();if(!vals.length)merr();
    switch(f){case 'Min(':return Math.min(...vals);case 'Max(':return Math.max(...vals);case 'Sum(':return vals.reduce((a,b)=>a+b,0);case 'Mean(':return vals.reduce((a,b)=>a+b,0)/vals.length}
  }
  const A=n.args.map(x=>ev(x,env)),x=A[0];
  const R=v=>{if(typeof v!=='number'){if(isM(v)||isV(v))derr();merr()}return v};
  const cxIn=S.mode==='CMPLX';
  switch(f){
    case 'sin(':return clean(Math.sin(toRad(R(x))));
    case 'cos(':return clean(Math.cos(toRad(R(x))));
    case 'tan(':{const r=toRad(R(x)),c=clean(Math.cos(r));if(c===0)merr();return clean(Math.sin(r))/c}
    case 'sin⁻¹(':if(Math.abs(R(x))>1)merr();return fromRad(Math.asin(x));
    case 'cos⁻¹(':if(Math.abs(R(x))>1)merr();return fromRad(Math.acos(x));
    case 'tan⁻¹(':return fromRad(Math.atan(R(x)));
    case 'sinh(':return Math.sinh(R(x));case 'cosh(':return Math.cosh(R(x));case 'tanh(':return Math.tanh(R(x));
    case 'sinh⁻¹(':return Math.asinh(R(x));
    case 'cosh⁻¹(':if(R(x)<1)merr();return Math.acosh(x);
    case 'tanh⁻¹(':if(Math.abs(R(x))>=1)merr();return Math.atanh(x);
    case '√(':if(isC(x))return cPow(x,0.5);if(R(x)<0){if(cxIn)return Cx(0,Math.sqrt(-x));merr()}return Math.sqrt(x);
    case '∛(':if(isC(x))return cPow(x,1/3);return Math.cbrt(R(x));
    case 'ln(':if(R(x)<=0)merr();return Math.log(x);
    case 'log(':if(A.length===1){if(R(x)<=0)merr();return Math.log10(x)}{const b=R(A[1]);if(R(x)<=0||x===1||b<=0)merr();return Math.log(b)/Math.log(x)}
    case 'e^(':return Math.exp(R(x));
    case '10^(':return isInt(R(x))?Number('1e'+Math.round(x)):Math.pow(10,x);
    case 'Abs(':if(isC(x))return cAbs(x);if(isV(x))return Math.hypot(...x.vec);if(isM(x))return mkMat(x.mat.map(r=>r.map(Math.abs)));return Math.abs(x);
    case 'Int(':return Math.trunc(round13(R(x)));
    case 'Intg(':return Math.floor(round13(R(x)));
    case 'Rnd(':return rndDisp(R(x));
    case 'GCD(':case 'LCM(':{if(!isInt(A[0])||!isInt(A[1]))merr();const a=Math.round(A[0]),b=Math.round(A[1]);if(f==='GCD(')return gcd(a,b);if(a===0||b===0)return 0;return Math.abs(a/gcd(a,b)*b)}
    case 'RanInt#(':{if(!isInt(A[0])||!isInt(A[1])||A[0]>A[1])merr();const a=Math.round(A[0]),b=Math.round(A[1]);return a+Math.floor(Math.random()*(b-a+1))}
    case 'Pol(':{const X=R(A[0]),Y=R(A[1]);const r=Math.hypot(X,Y);if(r===0)merr();const t=fromRad(Math.atan2(Y,X));S.vars.x=round15(r);S.vars.y=round15(t);S._pol={a:'<i>r</i>',b:'θ',va:round15(r),vb:round15(t)};return r}
    case 'Rec(':{const r=R(A[0]),t=toRad(R(A[1]));const X=clean(r*Math.cos(t)),Y=clean(r*Math.sin(t));S.vars.x=round15(X);S.vars.y=round15(Y);S._pol={a:'<i>x</i>',b:'<i>y</i>',va:round15(X),vb:round15(Y)};return X}
    case 'f(':case 'g(':{const src=S.fn&&S.fn[f[0]];if(!src)throw ERR('Not Defined');S._fd=(S._fd||0)+1;
      try{if(S._fd>2)throw ERR('Circular ERROR');return ev(parseExpr(desLine(src)).ast,{x:R(x)})}finally{S._fd--}}
    /* complex */
    case 'Arg(':return fromRad(cArg(x));
    case 'Conjg(':return Cx(re_(x),-im_(x));
    case 'ReP(':return re_(x);
    case 'ImP(':return im_(x);
    /* matrix / vector */
    case 'Det(':if(!isM(x))derr();return mDet(x.mat);
    case 'Trn(':if(!isM(x))derr();return mkMat(mTrn(x.mat));

/* returns 'enter' when = pressed while not editing, 'ac' for AC when not editing */
function gridKey(g,fn){
  if(g.err){g.err=null;return true}
  if(g.ed){
    if(edInput(g.ed,fn))return true;
    switch(fn){
      case 'DEL':edDel(g.ed);return true;case 'L':edLeft(g.ed);return true;case 'R':edRight(g.ed);return true;
      case 'AC':g.ed=null;return true;
      case '=':if(gridCommit(g)){if(g.move==='down')gridMove(g,1,0);else gridMove(g,0,1)}return true;
      case 'U':case 'D':if(!edVert(g.ed,fn==='U'?-1:1)){if(gridCommit(g))gridMove(g,fn==='U'?-1:1,0)}return true;
    }
    return true;
  }
  if(fn.startsWith('T:')||fn.startsWith('P:')){g.ed=newEd();g.ed.linear=true;edInput(g.ed,fn);return true}
  switch(fn){
    case 'L':gridMove(g,0,-1);return true;case 'R':gridMove(g,0,1);return true;

    case 'DEL':if(g.grow&&g.r<g.A.length-1){g.A.splice(g.r,1);if(g.onChange)g.onChange()}else if(g.grow){g.A[g.r]=g.A[g.r].map(()=>null)}return true;

}

const STYPES=[['1','1-Variable'],['lin','<i>y</i>=<i>a</i>+<i>bx</i>'],['quad','<i>y</i>=<i>a</i>+<i>bx</i>+<i>cx</i><sup>2</sup>'],['log','<i>y</i>=<i>a</i>+<i>b</i>·ln(<i>x</i>)'],

function statGrid(){

function statCalc(){
  const st=S.stat,n0=st.x.length;const two=st.type!=='1';

      for(let i=0;i<3;i++){let p=i;for(let k=i+1;k<3;k++)if(Math.abs(M[k][i])>Math.abs(M[p][i]))p=k;[M[i],M[p]]=[M[p],M[i]];if(Math.abs(M[i][i])<1e-300)merr();

}
function statVar(k){

const DTYPES=[

 {n:'Normal CD',f:['Lower','Upper','σ','μ'],v:[0,0,1,0]},

function dId(t){const T=DTYPES[t];return T.id!==undefined?T.id:t}

    case 1:{const[l,u,s,m]=P;if(s<=0)merr();return normCdf((u-m)/s)-normCdf((l-m)/s)}

    case 3:case 4:{const[x,N,p]=P;if(!isInt(N)||N<0||p<0||p>1||N>1e5)merr();return ti===3?binomPdf(x,Math.round(N),p):binomCdf(x,Math.round(N),p)}
    case 5:case 6:{const[x,l]=P;if(l<=0||l>1e8)merr();return ti===5?poisPdf(x,l):poisCdf(x,l)}
  }
}
function distKey(fn){
  const a=S.app;
  if(a.stage==='type'||a.stage==='how')return;
  if(a.stage==='list'){const r=gridKey(a.g,fn);if(r==='enter'){const T=DTYPES[a.t];a.F=formNew(T.f.slice(1),T.v.slice(1));a.stage='in'}return}
  if(a.stage==='in'){const r=formKey(a.F,fn);
    if(r==='enter'){
      const T=DTYPES[a.t];
      try{

function distHTML(){

    if(dId(a.t)===1)h+=`<div class="r2 sm"><span>z:Lower=</span><span>${decHTML(a.z[0])}</span></div><div class="r2 sm"><span>z:Upper=</span><span>${decHTML(a.z[1])}</span></div>`;

/* ---------- Spreadsheet ---------- */
function ssInit(){
  if(!S.ss)S.ss={cells:Array.from({length:45},()=>Array(5).fill(null))};
  Object.assign(S.app,{r:0,c:0,top:0,ed:null,mode:'nav',clip:null});
  ssRecalc();
}
function ssCellEnv(){
  const vis=new Set(),cache=new Map();
  const get=(r,c)=>{const cl=S.ss.cells[r][c];if(!cl)return 0;if(!cl.f)return cl.v;
    const key=r*5+c;if(cache.has(key))return cache.get(key);if(vis.has(key))throw ERR('Circular ERROR');vis.add(key);
    const v=reqReal(rnd15(ev(parseExpr(desLine(cl.src)).ast,env)));vis.delete(key);cache.set(key,v);return v};
  const env={cell:n=>get(n.r,n.c),range:rg=>{const vals=[];for(let r=Math.min(rg.a.r,rg.b.r);r<=Math.max(rg.a.r,rg.b.r);r++)for(let c=Math.min(rg.a.c,rg.b.c);c<=Math.max(rg.a.c,rg.b.c);c++){const cl=S.ss.cells[r][c];if(cl)vals.push(get(r,c))}return vals}};
  return {get,env};
}
function ssRecalc(force){
  if(!S.setup.ssAuto&&!force)return;
  const {get}=ssCellEnv();
  for(let r=0;r<45;r++)for(let c=0;c<5;c++){const cl=S.ss.cells[r][c];if(cl&&cl.f){try{cl.v=get(r,c);cl.e=null}catch(e){cl.v=null;cl.e=e.k||'ERROR';if(e.k==='Circular ERROR'){S.app.msg='Circular ERROR'}}}}
}
function shiftRefs(items,dr,dc){
  const out=[];
  for(let i=0;i<items.length;i++){
    const t=items[i];
    if(typeof t==='string'&&(t==='$'||SSCOL.includes(t)&&t.length===1)){
      let j=i,ac=false,ar=false;if(items[j]==='$'){ac=true;j++}
      const col=items[j];if(typeof col==='string'&&col.length===1&&SSCOL.includes(col)){let k=j+1;if(items[k]==='$'){ar=true;k++}let num='';while(typeof items[k]==='string'&&/^[0-9]$/.test(items[k]))num+=items[k++];
        if(num){let c=SSCOL.indexOf(col)+(ac?0:dc),r=+num+(ar?0:dr);if(c<0||c>4||r<1||r>45)throw ERR('Range ERROR');
          if(ac)out.push('$');out.push(SSCOL[c]);if(ar)out.push('$');out.push(...String(r).split(''));i=k-1;continue}}
    }
    out.push(isTpl(t)?{k:t.k,s:t.s.map(s=>shiftRefs(s,dr,dc))}:t);
  }
  return out;
}
function ssSetFromEd(r,c,items){
  const ser=serLine(items);
  if(ser[0]==='='){S.ss.cells[r][c]={f:true,src:ser.slice(1),v:null};parseExpr(desLine(ser.slice(1)));}
  else{const {env}=ssCellEnv();const v=reqReal(rnd15(ev(parseExpr(items).ast,env)));S.ss.cells[r][c]={f:false,src:ser,v}}
  if(ssBytes()>1700){S.ss.cells[r][c]=null;throw ERR('Memory ERROR')}
  ssRecalc();
}
function ssBytes(){let n=0;for(const row of S.ss.cells)for(const cl of row)if(cl)n+=cl.f?countItems(desLine(cl.src))+1:10;return n}
function ssMove(dr,dc){const a=S.app;a.r=Math.max(0,Math.min(44,a.r+dr));a.c=Math.max(0,Math.min(4,a.c+dc));if(a.r<a.top)a.top=a.r;if(a.r>a.top+3)a.top=a.r-3;if(a.c<(a.left||0))a.left=a.c;if(a.c>(a.left||0)+2)a.left=a.c-2}
function parseRange(items){const s=serLine(items).join('').replace(/\$/g,'');const m=/^([A-E])([0-9]{1,2}):([A-E])([0-9]{1,2})$/.exec(s);if(!m)throw ERR('Syntax ERROR');
  const r1=+m[2]-1,r2=+m[4]-1,c1=SSCOL.indexOf(m[1]),c2=SSCOL.indexOf(m[3]);if(r1<0||r2>44||r1>44||r2<0)throw ERR('Range ERROR');return [Math.min(r1,r2),Math.min(c1,c2),Math.max(r1,r2),Math.max(c1,c2)]}
function ssKey(fn){
  const a=S.app;
  if(a.msg){a.msg=null;return}
  if(a.mode==='fill'){const F=a.fill;
    if(F.ed){if(edInput(F.ed,fn))return;if(fn==='DEL'){edDel(F.ed);return}if(fn==='L'){edLeft(F.ed);return}if(fn==='R'){edRight(F.ed);return}if(fn==='AC'){F.ed=null;return}
      if(fn==='='||fn==='U'||fn==='D'){F.v[F.i]=serLine(F.ed.root);F.ed=null;if(fn==='U')F.i=0;else if(fn==='D')F.i=1;else if(F.i===0)F.i=1;else ssDoFill();return}return}
    if(fn.startsWith('T:')||fn.startsWith('P:')){F.ed=newEd();edInput(F.ed,fn);return}
    if(fn==='U')F.i=0;else if(fn==='D')F.i=1;else if(fn==='AC')a.mode='nav';else if(fn==='='){if(F.i===0)F.i=1;else ssDoFill()}
    return}
  if(a.mode==='grab'){

    else if(fn==='AC'){a.r=a.grab[0];a.c=a.grab[1];a.mode='edit'}
    else if(fn==='='){const ref=[SSCOL[a.c],...String(a.r+1).split('')];a.r=a.grab[0];a.c=a.grab[1];a.mode='edit';ref.forEach(t=>edIns(a.ed,t))}
    return}
  if(a.mode==='paste'){
    if(fn==='L')ssMove(0,-1);else if(fn==='R')ssMove(0,1);else if(fn==='U')ssMove(-1,0);else if(fn==='D')ssMove(1,0);
    else if(fn==='AC')a.mode='nav';
    else if(fn==='='){const cl=a.clip;try{const src=cl.cell.f&&!cl.cut?shiftRefs(desLine(cl.cell.src),a.r-cl.r,a.c-cl.c):desLine(cl.cell.src);S.ss.cells[a.r][a.c]={f:cl.cell.f,src:serLine(src),v:cl.cell.v};if(cl.cut){S.ss.cells[cl.r][cl.c]=null;a.mode='nav'}ssRecalc()}catch(e){a.msg=e.k||'ERROR';a.mode='nav'}}
    return}
  if(a.mode==='edit'){

      case 'UNDO':edUndo(a.ed);return;

    }
    return}

  switch(fn){

    case 'DEL':S.ss.cells[a.r][a.c]=null;ssRecalc();break;

}
function ssEditCell(){const a=S.app;const cl=S.ss.cells[a.r][a.c];a.ed=cl?edFrom(cl.f?['='].concat(desLine(cl.src)):desLine(cl.src)):newEd();a.mode='edit'}
function ssDoFill(){
  const a=S.app,F=a.fill;
  try{
    const [r1,c1,r2,c2]=parseRange(desLine(F.v[1]||[]));
    const src=desLine(F.v[0]||[]);if(!src.length)throw ERR('Syntax ERROR');
    if(F.kind==='formula'){const body=src[0]==='='?src.slice(1):src;parseExpr(desLine(serLine(body)));
      for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)S.ss.cells[r][c]={f:true,src:serLine(shiftRefs(body,r-r1,c-c1)),v:null}}
    else{const {env}=ssCellEnv();const v=reqReal(rnd15(ev(parseExpr(src).ast,env)));for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)S.ss.cells[r][c]={f:false,src:serLine(src),v}}
    if(ssBytes()>1700)throw ERR('Memory ERROR');

}
function ssHTML(){

/* ---------- Table ---------- */
function tabFns(){return S.setup.tbl==='fg'?['f','g']:S.setup.tbl==='g'?['g']:['f']}
function tabKey(fn){
  const t=S.app;
  if(t.err){t.err=null;return}
  if(t.stage==='f'||t.stage==='g'){
    const ed=t[t.stage];
    if(edInput(ed,fn))return;
    switch(fn){case 'DEL':edDel(ed);break;case 'L':edLeft(ed);break;case 'R':edRight(ed);break;case 'AC':edClear(ed);break;case 'UNDO':edUndo(ed);break;
      case 'U':if(!edVert(ed,-1)&&t.stage==='g'&&S.setup.tbl==='fg')t.stage='f';break;
      case 'D':if(!edVert(ed,1)&&t.stage==='f'&&S.setup.tbl==='fg')t.stage='g';break;
      case '=':try{
        if(t.stage==='f'&&S.setup.tbl==='fg'){if(!edEmpty(t.f))parseExpr(t.f.root);t.stage='g';break}
        const fns=tabFns();if(fns.every(k=>edEmpty(t[k])))throw ERR('Syntax ERROR');
        fns.forEach(k=>{if(!edEmpty(t[k]))parseExpr(t[k].root)});
        S.tbl={f:serLine(t.f.root),g:serLine(t.g.root),range:t.range};
        if(__CW){S.fn.f=edEmpty(t.f)?null:S.tbl.f;S.fn.g=edEmpty(t.g)?null:S.tbl.g}
        t.F=formNew(['Start','End','Step'],t.range);t.stage='range'}catch(e){t.err=e.k||'Syntax ERROR'}break}
    return}
  if(t.stage==='range'){const r=formKey(t.F,fn);if(r==='ac')t.stage=tabFns()[0];else if(r==='enter'){t.range=t.F.v.slice();S.tbl.range=t.range;tabBuild()}return}
  if(t.stage==='tab'){
    if(t.ed){
      if(edInput(t.ed,fn))return;
      if(fn==='DEL'){edDel(t.ed);return}if(fn==='AC'){t.ed=null;return}if(fn==='L'){edLeft(t.ed);return}if(fn==='R'){edRight(t.ed);return}
      if(fn==='='){try{const x=reqReal(rnd15(ev(parseExpr(t.ed.root).ast,{})));t.rows[t.sel]=tabRow(x)}catch(e){t.err=e.k||'Math ERROR'}t.ed=null}
      return}
    if((fn.startsWith('T:')||fn.startsWith('P:'))&&t.col===0){t.ed=newEd();edInput(t.ed,fn);return}
    const ncol=1+t.cols.length;
    switch(fn){
      case 'U':if(t.sel>0)t.sel--;break;
      case 'D':if(t.sel<t.rows.length-1)t.sel++;else if(t.rows.length<t.max){t.rows.push(tabRow(round15(t.rows[t.sel][0]+t.range[2])));t.sel++}break;
      case 'L':t.col=Math.max(0,t.col-1);break;case 'R':t.col=Math.min(ncol-1,t.col+1);break;
      case 'AC':t.stage=tabFns()[0];break;
    }
    if(t.sel<t.top)t.top=t.sel;if(t.sel>t.top+3)t.top=t.sel-3;
  }
}
function tabRow(x){
  const t=S.app;const row=[x];
  for(const k of t.cols){try{EVCOUNT=0;row.push(reqReal(rnd15(ev(parseExpr(t[k].root).ast,{x}))))}catch(e){row.push(null)}}
  return row;
}
function tabBuild(){
  const t=S.app;const [a,b,s]=t.range;
  t.cols=tabFns().filter(k=>!edEmpty(t[k]));t.max=t.cols.length>1?30:45;
  if(s===0||(b-a)/s<-1e-12){t.err='Range ERROR';return}
  const n=Math.floor((b-a)/s+1e-9)+1;if(n>t.max){t.err='Range ERROR';return}
  t.rows=[];for(let i=0;i<n;i++)t.rows.push(tabRow(round15(a+i*s)));
  t.sel=0;t.top=0;t.col=1;t.ed=null;t.stage='tab';
}
function tabHTML(){
  const t=S.app;
  if(t.err)return errHTML(t.err,false);
  if(t.stage==='f'||t.stage==='g'){
    let h='';
    for(const k of tabFns()){h+=`<div class="in tline${t.stage===k?'':' dim'}" ${t.stage===k?'id="in"':''}><i>${k}</i>(<i>x</i>)=${edHTML(t[k],t.stage===k)}</div>`}
    return h;
  }
  if(t.stage==='range')return formHTML(t.F,'Table Range');
  const H=['<i>x</i>'].concat(t.cols.map(k=>`<i>${k}</i>(<i>x</i>)`));
  let h='<table class="g"><tr><th class="rn"></th>'+H.map(x=>`<th>${x}</th>`).join('')+'</tr>';
  t.rows.slice(t.top,t.top+4).forEach((r,ii)=>{const i=ii+t.top;h+=`<tr><td class="rn">${i+1}</td>`+r.map((v,j)=>`<td class="${i===t.sel&&j===t.col?'hl':''}">${v===null?'ERROR':fmtShort(v)}</td>`).join('')+'</tr>'});
  const sv=t.rows[t.sel][t.col];
  return h+`</table>`+(t.ed?`<div class="bot l" id="in">${edHTML(t.ed)}</div>`:`<div class="bot">${sv===null?'ERROR':decHTML(sv)}</div>`);
}

/* ---------- Equation/Func ---------- */
const EQHDR={sim2:'a<sub>n</sub><i>x</i>+b<sub>n</sub><i>y</i>=c<sub>n</sub>',sim3:'a<sub>n</sub><i>x</i>+b<sub>n</sub><i>y</i>+c<sub>n</sub><i>z</i>=d<sub>n</sub>',sim4:'a<sub>n</sub><i>x</i>+…+d<sub>n</sub><i>t</i>=e<sub>n</sub>',
 poly2:'a<i>x</i>²+b<i>x</i>+c=0',poly3:'a<i>x</i>³+b<i>x</i>²+c<i>x</i>+d=0',poly4:'a<i>x</i>⁴+b<i>x</i>³+c<i>x</i>²+d<i>x</i>+e=0'};
function eqnStart(kind,n){const a=S.app;a.kind=kind;a.n=n;const rows=kind==='sim'?n:1,cols=n+1;
  a.g=gridNew(Array.from({length:rows},()=>Array(cols).fill(0)),{hdr:'abcde'.split(''),rlab:kind==='sim',visC:cols>4?4:cols});a.stage='in'}
function eqnKey(fn){
  const a=S.app;
  if(a.stage==='solver'){const c=cs();if(fn==='='&&!c.prompt&&!c.res&&!c.err)return csKey('SOLVE');return csKey(fn)}
  if(a.stage==='in'){const r=gridKey(a.g,fn);if(r==='enter')eqnSolve();return}
  if(a.stage==='res'){
    if(a.msg){if(['AC','=','U','D'].includes(fn))a.stage='in';return}
    if(fn==='D'||fn==='='){if(a.si<a.sol.length-1)a.si++;else if(fn==='=')a.stage='in'}
    else if(fn==='U'){if(a.si>0)a.si--}else if(fn==='AC')a.stage='in';return}
}
function eqnSolve(){
  const a=S.app;a.si=0;a.msg=null;a.sol=[];a.stage='res';
  if(a.kind==='sim'){
    const n=a.n,A=a.g.A.map(r=>r.slice());const sc=Math.max(1e-300,...A.flat().map(Math.abs));let rank=0;
    for(let col=0,row=0;col<n&&row<n;col++){let b=row;for(let i=row+1;i<n;i++)if(Math.abs(A[i][col])>Math.abs(A[b][col]))b=i;if(Math.abs(A[b][col])<1e-12*sc)continue;[A[row],A[b]]=[A[b],A[row]];
      for(let i=0;i<n;i++)if(i!==row){const f=A[i][col]/A[row][col];for(let j=col;j<=n;j++)A[i][j]-=f*A[row][j]}row++;rank=row}
    if(rank<n){let inc=false;for(let i=rank;i<n;i++)if(Math.abs(A[i][n])>1e-10*sc)inc=true;a.msg=inc?'No Solution':'Infinite Solution';return}
    const L=['x','y','z','t'];a.sol=A.map((r,i)=>({lab:`<i>${L[i]}</i>`,re:round13(r[n]/r[i]),im:0}));return}
  const c=a.g.A[0].slice();if(c[0]===0){a.stage='in';a.g.err='Math ERROR';return}
  let roots=polySolve(c);
  const real=roots.filter(r=>r.im===0);
  if(!S.setup.eqCplx){roots=real;if(!roots.length){a.msg='No Real Roots';return}}
  a.sol=roots.map((r,i)=>Object.assign(r,{lab:roots.length===1?'<i>x</i>':`<i>x</i><sub>${i+1}</sub>`}));
  // extrema for quadratic / cubic
  const p=x=>c.reduce((s,v)=>s*x+v,0);
  if(a.n===2){const xv=-c[1]/(2*c[0]);a.sol.push({lab:'<i>x</i>=',re:round13(xv),im:0,ext:1});a.sol.push({lab:c[0]>0?'<i>y</i> Minimum=':'<i>y</i> Maximum=',re:round13(p(xv)),im:0,ext:1})}
  if(__CW&&a.n===3){const A3=3*c[0],B3=2*c[1],C3=c[2];const D=B3*B3-4*A3*C3;
    if(D>0){const s=Math.sqrt(D);const x1=(-B3-s)/(2*A3),x2=(-B3+s)/(2*A3);
      const pts=[x1,x2].sort((u,v)=>u-v).map(x=>({x,y:p(x),max:(6*c[0]*x+2*c[1])<0}));
      pts.sort((u,v)=>(v.max?1:0)-(u.max?1:0));

const IQREL=['&gt;','&lt;','≥','≤'];

  if(a.stage==='res'){if(fn==='AC'||fn==='=')a.stage='in';else if(fn==='D')a.top=Math.min((a.top||0)+1,Math.max(0,a.out.length-3));else if(fn==='U')a.top=Math.max(0,(a.top||0)-1);return}

  const m=/^T:(\d)$/.exec(fn);let idx=-1;

  else if(m&&o.paged){const d=+m[1];const pg=Math.floor(o.sel/o.paged);if(d>=1&&d<=o.paged)idx=pg*o.paged+d-1}

  if(o.menu&&fn.startsWith('T:h'))idx=9+'ABC'.indexOf(fn.slice(3));

    case 'L':if(o.menu||o.grid){o.sel=(o.sel-1+n)%n}return 'stay';
    case 'R':if(o.menu||o.grid){o.sel=(o.sel+1)%n}return 'stay';
    case '=':idx=o.sel;break;

function ovKey(fn,v){

  if(o.k==='confirm'){if(fn==='='){ovs.length=0;o.fn()}else if(fn==='AC')ovs.pop();return}

  if(o.k==='contrast'){if(fn==='L')S.setup.contrast=Math.max(1,S.setup.contrast-1);else if(fn==='R')S.setup.contrast=Math.min(9,S.setup.contrast+1);else if(fn==='AC'||fn==='=')ovs.pop();return}

    if(o.close&&fn===o.close){ovs.length=0;return}

function tlKey(fn,v){
  const o=S.app.tlStack&&S.app.tlStack.length?S.app.tlStack[S.app.tlStack.length-1]:S.app.tl;
  const r=listKey(o,fn,v);
  const mv=S.mode==='MATRIX'||S.mode==='VECTOR';
  if(r==='back'){if(S.app.tlStack&&S.app.tlStack.length)S.app.tlStack.pop();else if(mv)S.app.tl=null;return}
  if(r==='stay'){if(ovs.length){S.app.tlStack=S.app.tlStack||[];S.app.tlStack.push(ovs.pop())}return}
  S.app.tlStack=[];if(mv)S.app.tl=null;
}

/* ---------- key dispatch ---------- */
function press(id){
  const k=K[id];if(!k)return;
  if(!S.power){if(id==='on'){S.power=true;onKey()}render();return}
  if(id==='shift'){S.shift=!S.shift;S.alpha=false;render();return}
  if(id==='alpha'){S.alpha=!S.alpha;S.shift=false;render();return}
  const sh=S.shift,al=S.alpha;S.shift=S.alpha=false;
  let fn=(sh&&S.mode==='BASE'&&k.bsf)?k.bsf:(sh&&S.mode==='CMPLX'&&k.csf)?k.csf:sh?k.sf:al?k.af:(S.mode==='BASE'&&k.bf)?k.bf:(S.mode==='CMPLX'&&k.cf)?k.cf:k.f;
  if(S.sto){S.sto=false;if(k.v&&CALCMODES.has(S.mode)&&!ovs.length&&!(S.app&&S.app.def)){doStore(k.v);render();return}if(id==='ac'){render();return}}
  if(fn)act(fn,k.v);
  render();
}
function onKey(){ovs.length=0;S.sto=false;S.ins=false;const m=S.mode;const keep=S.app;setMode(m);if(m==='MATRIX'||m==='VECTOR'||CALCMODES.has(m)){/* fresh */}}
function act(fn,v){
  try{
    if(fn==='ON'){onKey();return}
    if(fn==='OFF'){S.power=false;ovs.length=0;return}
    if(ovs.length){
      if(fn==='MENU'&&ovs[0].menu){ovs.length=0;return}
      const wasSetup=ovs[0].close==='SETUP';
      ovKey(fn,v);
      if(wasSetup&&!ovs.length){const c=S.app.cs;if(c&&c.res&&typeof c.res.v==='number')c.res.form=defForm()}
      return;
    }
    switch(fn){
      case 'MENU':ovs.push(menuOv());return;
      case 'SETUP':ovs.push(setupOv());return;
      case 'RESET':ovs.push(resetOv());return;
      case 'CONST':ovs.push(constOv());return;
      case 'CONV':ovs.push(convOv());return;
      case 'QR':ovs.push(msgOv('QR 코드는 실제 기기에서<br>Casio 서버 주소를 만들어<br>스마트폰으로 그래프를 봅니다.<br>오프라인 웹 버전에서는<br>지원하지 않습니다.'));return;
      case 'RCL':ovs.push({k:'recall'});return;
      case 'OPTN':{if(S.app.tl)return;const o=optnOv();if(o)ovs.push(o);return}
    }
    if(S.app.tl)return tlKey(fn,v);
    appKey(fn,v);
  }catch(e){console.error(e);ovs.length=0;ovs.push(msgOv(e&&e.k?e.k:'ERROR'))}
}

/* ---------- rendering ---------- */
function listHTML(o){
  if(o.menu)return '<div class="menu'+(o.cols===4?' c4':'')+'">'+o.items.map((it,i)=>`<div class="mi${i===o.sel?' hl':''}"><div class="ic">${it.ic}</div><div class="mn">${i<9?i+1:'ABCD'[i-9]}:${it.t}</div></div>`).join('')+'</div>';
  if(o.grid){const n=o.items.length,pg=Math.floor(o.sel/9)*9;let h=`<div class="hdr">${o.title}</div><div class="cg">`;for(let i=pg;i<Math.min(n,pg+9);i++)h+=`<div class="${i===o.sel?'hl':''}">${i-pg+1}:${o.items[i].t}</div>`;return h+`</div><div class="hdr cd"><span>${o.items[o.sel].desc||''}</span><span>${pg>0?'▲':''}${pg+9<n?'▼':''}</span></div>`}
  const vis=o.paged||(o.title?4:5),n=o.items.length;const top=o.paged?Math.floor(o.sel/o.paged)*o.paged:Math.max(0,Math.min(o.sel-vis+1,n-vis));
  let h=o.title?`<div class="hdr">${o.title}</div>`:'';
  h+='<div class="list">';
  o.items.forEach((it,i)=>{if(!it||i<top||i>=top+vis)return;const r=it.right?(typeof it.right==='function'?it.right():it.right):'';
    h+=`<div class="row${i===o.sel?' hl':''}"><span>${it.key!==undefined?'':o.paged?(i%o.paged+1)+':':(i<9?(i+1)+':':'')}${it.t}</span>${r?`<small>${r}</small>`:''}</div>`});
  h+='</div>';
  if(n>vis)h+=`<div class="scroll">${top>0?'▲':''}${top+vis<n?'▼':''}</div>`;
  return h;
}
function ovHTML(o){
  if(o.k==='list')return listHTML(o);
  if(o.k==='msg')return `<div class="err"><div class="eh" style="font-size:14px">${o.text}</div></div>`;
  if(o.k==='confirm')return `<div class="err"><div class="em">${o.text}</div><div class="eh">[=] :Yes<br>[AC] :Cancel</div></div>`;
  if(o.k==='recall'){let h='<div class="hdr">RECALL</div><div class="rc">';VARS.forEach(v=>{const val=S.vars[v];h+=`<div>${v==='x'||v==='y'?'<i>'+v+'</i>':v}=${typeof val==='number'?fmtShort(val):'…'}</div>`});return h+'</div>'}
  if(o.k==='contrast')return `<div class="err"><div class="em">CONTRAST</div><div class="eh">LIGHT ◀ ${'■'.repeat(S.setup.contrast)}${'□'.repeat(9-S.setup.contrast)} ▶ DARK<br>[AC] :Exit</div></div>`;
  return '';
}
function statusHTML(){
  const st=S.setup,it=[];
  if(S.shift)it.push('<span class="inv">S</span>');
  if(S.alpha)it.push('<span class="inv">A</span>');
  if(S.vars.M!==0)it.push('<span>M</span>');
  if(S.sto)it.push('<span>STO</span>');
  if(ovs.length&&ovs[ovs.length-1].k==='recall')it.push('<span>RCL</span>');
  if(S.ins&&!isMathIn())it.push('<span>INS</span>');
  it.push(`<span class="inv">${st.angle}</span>`);
  if(st.fmt!=='Norm')it.push(`<span>${st.fmt.toUpperCase()}</span>`);
  if(isMathIn())it.push('<span>Math▸</span>');
  if(S.mode==='CMPLX')it.push('<span><i>i</i></span>');
  if(S.mode==='BASE')it.push(`<span>${({10:'Dec',16:'Hex',2:'Bin',8:'Oct'})[S.app.base||10]}</span>`);
  if(st.eng)it.push('<span>ENG</span>');
  if(S.mode==='SS'&&!st.ssAuto)it.push('<span>Manual</span>');
  it.push('<span class="sp"></span>');
  const c=S.app&&S.app.cs;if(CALCMODES.has(S.mode)&&c&&!ovs.length){const H=S.hist.filter(h=>h.m===S.mode);const up=c.hi<H.length-1,dn=c.hi>0&&!!c.res;if(H.length)it.push(`<span>${up?'▲':''}${dn?'▼':''}</span>`)}
  return it.join('');
}
function render(){
  if(typeof document==='undefined')return;
  const lcd=document.getElementById('lcd');
  document.body.classList.toggle('S',S.shift);document.body.classList.toggle('A',S.alpha);
  document.body.classList.toggle('mBASE',S.mode==='BASE');document.body.classList.toggle('mCMPLX',S.mode==='CMPLX');
  if(!S.power){lcd.className='lcd off';save();return}
  lcd.className='lcd'+(S.setup.font==='S'?' sf':'');
  {const a=0.45+S.setup.contrast*0.06,mx=(i,p)=>Math.round(a*i+(1-a)*p);lcd.style.setProperty('--ink',`rgb(${mx(14,214)},${mx(18,220)},${mx(12,208)})`)}
  document.getElementById('st').innerHTML=statusHTML();
  const main=document.getElementById('main');SLOTS=[];
  let h;
  if(ovs.length)h=ovHTML(ovs[ovs.length-1]);
  else if(S.app.tl)h=listHTML(S.app.tlStack&&S.app.tlStack.length?S.app.tlStack[S.app.tlStack.length-1]:S.app.tl);
  else h=appHTML()||'';
  main.innerHTML=h;
  const inn=document.getElementById('in'),cur=document.getElementById('cur');
  if(inn&&cur){const ir=inn.getBoundingClientRect(),cr=cur.getBoundingClientRect();
    if(cr.bottom>ir.bottom)inn.scrollTop+=cr.bottom-ir.bottom+2;if(cr.top<ir.top)inn.scrollTop-=ir.top-cr.top+2;
    if(cr.right>ir.right)inn.scrollLeft+=cr.right-ir.right+8;if(cr.left<ir.left)inn.scrollLeft-=ir.left-cr.left+8}
  save();
}

  const up=()=>document.querySelectorAll('.pr').forEach(b=>b.classList.remove('pr'));
  window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
  document.addEventListener('contextmenu',e=>e.preventDefault());
  const KB={'0':'n0','1':'n1','2':'n2','3':'n3','4':'n4','5':'n5','6':'n6','7':'n7','8':'n8','9':'n9','.':'dot','+':'add','-':'sub','*':'mul','/':'frac','(':'lp',')':'rp','Enter':'eq','=':'eq','Backspace':'del','Delete':'del','Escape':'ac','ArrowUp':'up','ArrowDown':'down','ArrowLeft':'left','ArrowRight':'right','^':'pw','x':'xv','s':'sin','c':'cos','t':'tan','l':'ln','r':'sqrt','m':'menu','o':'optn'};
  document.addEventListener('keydown',e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    if(e.key==='!'){act('T:!');render();e.preventDefault();return}
