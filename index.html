<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>근무표</title>
<style>
:root{box-sizing:border-box;--bg:#f4f6f8;--fg:#18212b;--card:#fff;--mut:#6b7684;--line:#dde2e8;--acc:#1f3a5f;--sun:#d64545;--sat:#2f6fd6;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--fg:#e8edf2;--card:#1b232c;--mut:#93a0ae;--line:#2a343f;--acc:#7fa8e0;--sun:#ff7b7b;--sat:#7fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--fg:#e8edf2;--card:#1b232c;--mut:#93a0ae;--line:#2a343f;--acc:#7fa8e0;--sun:#ff7b7b;--sat:#7fb0ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 "Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;max-width:480px;margin:0 auto;min-height:100vh;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;gap:6px;padding:14px 12px 8px}
header h1{flex:1;margin:0;font-size:21px;font-weight:700;text-align:center}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:40px;padding:8px 0;text-align:center}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{padding:0 6px;color:var(--mut);font-size:12px;text-align:center}
.dow :first-child{color:var(--sun)}.dow :last-child{color:var(--sat)}
.grid{gap:2px;padding:4px 4px 10px}
.cell{min-height:118px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.cell.out{visibility:hidden}
.cell .n{font-size:13px}
.cell.s0 .n{color:var(--sun)}.cell.s6 .n{color:var(--sat)}
.cell.today{border:2px solid var(--acc)}
.cell.today .n{font-weight:800}
.chip{font-size:15px;font-weight:800;text-align:center;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.memo{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.sum{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 14px}
.sum span{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.sum .chip{font-size:14px}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:18px}
.sheet h3{margin:16px 0 8px;font-size:14px;color:var(--mut);font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.opts button{display:flex;align-items:center;gap:6px;padding:8px}
.opts button.on{border:2px solid var(--acc)}
input[type=text]{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.row input[type=text]{min-width:0}
.row .nm{flex:2}.row .sh{flex:0 0 52px;text-align:center}
input[type=color]{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--bg);flex:none}
.pat{display:flex;flex-wrap:wrap;gap:4px;min-height:30px;margin-bottom:8px}
.full{width:100%;margin-top:10px}
.pri{background:var(--acc);color:var(--card);border-color:var(--acc);font-weight:700}
.hint{color:var(--mut);font-size:12.5px;margin:6px 0 0}
.sub{margin:-2px 0 12px 46px;font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tm{font-size:10.5px;color:var(--mut);line-height:1}
.mm{width:100%;font-size:11px;line-height:1.25;opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:anywhere;word-break:break-all;padding:0 1px}
.cell.hol .n{color:var(--sun)}
.nx{margin:0 12px 12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.nx .chip{display:inline-block}
.sub input,.sub select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px}
.btn{display:block;text-align:center;text-decoration:none;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:700}
</style></head>
<body>
<header>
  <button class="ic" id="prev" aria-label="이전 달">◀</button>
  <h1 id="ttl"></h1>
  <button class="ic" id="next" aria-label="다음 달">▶</button>
  <button id="today">오늘</button>
  <button class="ic" id="gear" aria-label="설정">⚙</button>
</header>
<div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
<div class="grid" id="grid"></div>
<div id="nx"></div>
<div class="sum" id="sum"></div>
<div class="bg" id="bg"><div class="sheet" id="sheet"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const WD=['일','월','화','수','목','금','토'];
const HOL=new Set(('2026-01-01 2026-02-16 2026-02-17 2026-02-18 2026-03-01 2026-03-02 2026-05-05 2026-05-24 2026-05-25 2026-06-03 2026-06-06 2026-08-15 2026-08-17 2026-09-24 2026-09-25 2026-09-26 2026-10-03 2026-10-05 2026-10-09 2026-12-25 '
+'2027-01-01 2027-02-06 2027-02-07 2027-02-08 2027-02-09 2027-03-01 2027-05-05 2027-05-13 2027-06-06 2027-08-15 2027-08-16 2027-09-14 2027-09-15 2027-09-16 2027-10-03 2027-10-04 2027-10-09 2027-10-11 2027-12-25 2027-12-27').split(' '));
const DEF={shifts:[{id:'a',name:'조근',short:'조',color:'#e08a00',aw:'06:00',ah:'07:00'},{id:'b',name:'야근',short:'야',color:'#4a4fc4',aw:'',ah:''},{id:'c',name:'휴무',short:'휴',color:'#2e9b62',aw:'',ah:''},{id:'d',name:'연차',short:'연',color:'#d6457a',aw:'',ah:''}],days:{},pattern:[]};
let S=null;
try{S=JSON.parse(localStorage.getItem('worktable'))}catch(e){}
if(!S||!S.shifts)S=JSON.parse(JSON.stringify(DEF));
S.shifts.forEach(s=>{if(s.aw===undefined){let v='';if(s.t){const p=s.t.split(':').map(Number),t=((p[0]*60+p[1]-(+s.al||0))%1440+1440)%1440;v=pad(Math.floor(t/60))+':'+pad(t%60)}s.aw=v;s.ah=v}});
const save=()=>{try{localStorage.setItem('worktable',JSON.stringify(S))}catch(e){}syncAlarms()};
const byId=id=>S.shifts.find(x=>x.id===id);
const defHol=k=>{const d=new Date(k+'T00:00:00').getDay();return d===0||d===6||HOL.has(k)};
const isHol=k=>{const e=S.days[k];return e&&e.h!==undefined?!!e.h:defHol(k)};
const clean=k=>{const e=S.days[k];if(e&&e.s===undefined&&!e.m&&e.h===undefined&&!e.n)delete S.days[k]};
function alarmOf(k){const e=S.days[k],s=e&&e.s&&byId(e.s);if(!s||e.n)return null;const tm=isHol(k)?s.ah:s.aw;return tm?{s:s,tm:tm}:null}
function alarmUrl(a){const p=a.tm.split(':').map(Number);return 'intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR='+p[0]+';i.android.intent.extra.alarm.MINUTES='+p[1]+';S.android.intent.extra.alarm.MESSAGE='+encodeURIComponent(a.s.name)+';end'}
let cur=new Date();cur.setDate(1);cur.setHours(0,0,0,0);
let sel=null;
function chipOf(id){const s=byId(id);return s?'<b class="chip" style="color:'+s.color+'">'+esc(s.short)+'</b>':''}
function dayWord(k){const d=new Date(k+'T00:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'}

function render(){
  const y=cur.getFullYear(),m=cur.getMonth();
  $('#ttl').textContent=y+'년 '+(m+1)+'월';
  const first=new Date(y,m,1).getDay(),len=new Date(y,m+1,0).getDate();
  const tk=key(new Date());
  let h='';
  for(let i=0;i<first;i++)h+='<div class="cell out"></div>';
  const cnt={};
  for(let d=1;d<=len;d++){
    const k=y+'-'+pad(m+1)+'-'+pad(d),dow=(first+d-1)%7,e=S.days[k]||{},sh=e.s&&byId(e.s),a=alarmOf(k);
    if(sh)cnt[sh.id]=(cnt[sh.id]||0)+1;
    h+='<div class="cell s'+dow+(isHol(k)?' hol':'')+(k===tk?' today':'')+'" data-k="'+k+'"><span class="n">'+d+'</span>'
      +(sh?'<span class="chip" style="color:'+sh.color+'">'+esc(sh.name)+'</span>':'')
      +(a?'<span class="tm">'+a.tm+'</span>':'')
      +(e.m?'<span class="mm">'+esc(e.m)+'</span>':'')+'</div>';
  }
  $('#grid').innerHTML=h;
  $('#sum').innerHTML=S.shifts.map(s=>'<span><b class="chip" style="color:'+s.color+'">'+esc(s.short)+'</b>'+esc(s.name)+' '+(cnt[s.id]||0)+'일</span>').join('');
  const t=new Date();t.setDate(t.getDate()+1);const nk=key(t),na=alarmOf(nk);
  $('#nx').innerHTML=na&&!NP?'<div class="nx"><div>내일 '+dayWord(nk)+' '+chipOf(na.s.id)+' '+esc(na.s.name)+' · '+(isHol(nk)?'휴일':'평일')+'</div><a class="btn" href="'+alarmUrl(na)+'" target="_blank" rel="noopener">⏰ '+na.tm+' 알람 맞추기</a></div>':'';
}

function open(html){$('#sheet').innerHTML=html;$('#bg').classList.add('on')}
function close(){$('#bg').classList.remove('on')}

function openDay(k){
  sel=k;
  const e=S.days[k]||{},a=alarmOf(k),hol=isHol(k),s0=e.s&&byId(e.s),rt=s0?(hol?s0.ah:s0.aw):'';
  open('<h2>'+dayWord(k)+' · '+(hol?'휴일':'평일')+'</h2><div class="opts">'
    +S.shifts.map(s=>'<button data-set="'+s.id+'"'+(e.s===s.id?' class="on"':'')+'><b class="chip" style="color:'+s.color+'">'+esc(s.short)+'</b>'+esc(s.name)+'</button>').join('')
    +'<button data-set="">비우기</button></div>'
    +'<button class="full" id="hol">'+(hol?'평일로 바꾸기':'휴일로 바꾸기')+'</button>'
    +(rt?'<h3>알람</h3>'+(NP?(e.n?'<p class="hint">이 날은 알람이 꺼져 있어요 ('+rt+').</p><button class="full pri" id="aln">이 날 알람 켜기</button>':'<p>⏰ '+rt+' 알람이 자동으로 예약돼 있어요 ('+(hol?'휴일':'평일')+').</p><button class="full" id="aln">이 날 알람 끄기</button>'):(a?'<a class="btn" href="'+alarmUrl(a)+'" target="_blank" rel="noopener">⏰ '+a.tm+' 알람 맞추기 ('+esc(a.s.name)+', '+(hol?'휴일':'평일')+')</a><p class="hint">시계 앱이 열리면 저장만 누르세요. 가장 가까운 '+a.tm+'에 한 번 울려요.</p>':'')):'')
    +'<h3>메모</h3><input type="text" id="memo" maxlength="80" placeholder="예: 대타, 병원 예약" value="'+esc(e.m||'')+'">'
    +'<h3>패턴 반복</h3>'
    +(S.pattern.length?'<div class="pat">'+S.pattern.map(chipOf).join('')+'</div><button class="full pri" id="apply">이 날부터 60일 적용</button>':'<p class="hint">설정(⚙)에서 반복 패턴을 먼저 만들어 두세요. 예: 조 → 조 → 야 → 야 → 휴 → 휴</p>')
    +'<button class="full" id="done">닫기</button>');
  const mi=$('#memo');
  mi.oninput=()=>{S.days[k]=S.days[k]||{};S.days[k].m=mi.value;clean(k);save();render()};
}
function setShift(id){
  const e=S.days[sel]=S.days[sel]||{};
  if(id)e.s=id;else delete e.s;
  clean(sel);save();render();close();
}
function toggleAl(){const e=S.days[sel]=S.days[sel]||{};if(e.n)delete e.n;else e.n=1;clean(sel);save();render();openDay(sel)}
function testAlarm(){
  const m=$('#tstm');
  if(!NP){m.textContent='앱(APK)에서만 쓸 수 있어요.';return}
  NP.scheduleAll({alarms:[{t:Date.now()+10000,m:'테스트 알람'}]}).then(()=>{m.textContent='10초 뒤에 알람이 울려요. 알림 권한이 허용되어 있어야 해요.';setTimeout(syncAlarms,15000)}).catch(()=>{m.textContent='예약하지 못했어요.'});
}
function toggleHol(){
  const e=S.days[sel]=S.days[sel]||{},want=!isHol(sel);
  if(want===defHol(sel))delete e.h;else e.h=want?1:0;
  clean(sel);save();render();openDay(sel);
}
function applyPattern(){
  const p=S.pattern,d=new Date(sel+'T00:00:00');
  for(let i=0;i<60;i++){
    const k=key(d),e=S.days[k]=S.days[k]||{};
    e.s=p[i%p.length];
    d.setDate(d.getDate()+1);
  }
  save();render();close();
}
function subRow(s,i){
  return '<div class="sub">알람 평일 <input type="time" value="'+(s.aw||'')+'" data-f="aw" data-i="'+i+'" aria-label="평일 알람 시각"> 휴일 <input type="time" value="'+(s.ah||'')+'" data-f="ah" data-i="'+i+'" aria-label="휴일 알람 시각"></div>';
}
function openSettings(){
  open('<h2>설정</h2><h3>근무 종류와 알람 시각</h3>'
    +S.shifts.map((s,i)=>'<div class="row"><input type="color" value="'+s.color+'" data-f="color" data-i="'+i+'" aria-label="색상"><input type="text" class="nm" value="'+esc(s.name)+'" data-f="name" data-i="'+i+'" maxlength="8" aria-label="이름"><input type="text" class="sh" value="'+esc(s.short)+'" data-f="short" data-i="'+i+'" maxlength="2" aria-label="약자"><button data-del="'+i+'" aria-label="삭제">✕</button></div>'+subRow(s,i)).join('')
    +'<button class="full" id="add">+ 근무 종류 추가</button><p class="hint">'+(NP?'앞으로 60일치 알람이 자동으로 예약돼요. 알림 권한을 꼭 허용해 주세요. ':'')+'같은 근무라도 평일과 휴일의 알람 시각을 따로 정해요. 비워 두면 알람이 없어요. 휴일은 토·일요일과 공휴일(2026~2027년)이고, 날짜를 눌러 평일·휴일을 바꿀 수 있어요.</p>'
    +'<h3>반복 패턴</h3><div class="pat">'+S.pattern.map(chipOf).join('')+(S.pattern.length?'':'<span class="hint">비어 있음</span>')+'</div>'
    +'<div class="opts">'+S.shifts.map(s=>'<button data-pat="'+s.id+'"><b class="chip" style="color:'+s.color+'">'+esc(s.short)+'</b>추가</button>').join('')+'<button data-pat="-">한 칸 지우기</button><button data-pat="x">전체 지우기</button></div>'
    +'<p class="hint">날짜를 눌러 “패턴 반복”을 쓰면 그 날부터 순서대로 채워집니다.</p>'
    +(NP?'<h3>알람 테스트</h3><button class="full" id="tst">10초 뒤 테스트 알람</button><p class="hint" id="tstm"></p>':'')
    +'<h3>캘린더 알람</h3><button class="full pri" id="exp">오늘 이후 근무표 복사</button><textarea id="expt" readonly rows="5" style="display:none;width:100%;margin-top:8px;font:12px monospace;background:var(--bg);color:inherit;border:1px solid var(--line);border-radius:10px;padding:8px"></textarea><p class="hint" id="expm">복사한 내용을 Claude 채팅에 붙여넣으면 캘린더(.ics) 파일로 만들어 드려요.</p>'
    +'<button class="full" id="done">닫기</button>');
}
function exportTxt(){
  const tk=key(new Date()),L=[],ta=$('#expt'),m=$('#expm');
  Object.keys(S.days).sort().forEach(k=>{
    if(k<tk)return;
    const s=byId(S.days[k].s);if(!s)return;
    const a=alarmOf(k);
    L.push(k+' '+s.name+' '+(isHol(k)?'휴일':'평일')+(a?' 알람'+a.tm:' 알람없음'));
  });
  if(!L.length){m.textContent='오늘 이후에 입력된 근무가 없어요.';return}
  ta.value=L.join('\n');ta.style.display='block';ta.select();
  const hold='복사가 막혀 있어요. 위 내용을 길게 눌러 직접 복사해 주세요.';
  try{navigator.clipboard.writeText(ta.value).then(()=>{m.textContent=L.length+'일치를 복사했어요. 채팅에 붙여넣어 주세요.'},()=>{m.textContent=hold})}catch(e){m.textContent=hold}
}

$('#grid').onclick=e=>{const c=e.target.closest('.cell[data-k]');if(c)openDay(c.dataset.k)};
$('#bg').onclick=e=>{
  const t=e.target;
  if(t.id==='bg'||t.id==='done'){close();return}
  const b=t.closest('button');if(!b)return;
  if(b.dataset.set!==undefined)setShift(b.dataset.set);
  else if(b.id==='apply')applyPattern();
  else if(b.id==='hol')toggleHol();
  else if(b.id==='aln')toggleAl();
  else if(b.id==='tst')testAlarm();
  else if(b.id==='exp')exportTxt();
  else if(b.id==='add'){S.shifts.push({id:'s'+Date.now(),name:'새 근무',short:'새',color:'#'+Math.floor(Math.random()*0x888888+0x333333).toString(16).padStart(6,'0'),aw:'',ah:''});save();render();openSettings()}
  else if(b.dataset.del!==undefined){
    const s=S.shifts[+b.dataset.del];
    S.shifts.splice(+b.dataset.del,1);
    S.pattern=S.pattern.filter(id=>id!==s.id);
    for(const k in S.days){if(S.days[k].s===s.id){delete S.days[k].s;clean(k)}}
    save();render();openSettings();
  }
  else if(b.dataset.pat!==undefined){
    const v=b.dataset.pat;
    if(v==='x')S.pattern=[];else if(v==='-')S.pattern.pop();else S.pattern.push(v);
    save();openSettings();
  }
};
$('#bg').oninput=e=>{
  const t=e.target,i=t.dataset.i;
  if(i===undefined)return;
  S.shifts[+i][t.dataset.f]=t.value;
  save();render();
};
$('#prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$('#next').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$('#today').onclick=()=>{cur=new Date();cur.setDate(1);cur.setHours(0,0,0,0);render()};
$('#gear').onclick=openSettings;
let x0=null;
$('#grid').addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
$('#grid').addEventListener('touchend',e=>{
  if(x0===null)return;
  const dx=e.changedTouches[0].clientX-x0;x0=null;
  if(Math.abs(dx)>70){cur.setMonth(cur.getMonth()+(dx<0?1:-1));render()}
});
document.addEventListener('click',e=>{
  const a=e.target.closest('a.btn'),P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.AlarmPlugin;
  if(!a||!P)return;
  const m=a.href.match(/HOUR=(\d+);i\.android\.intent\.extra\.alarm\.MINUTES=(\d+);S\.android\.intent\.extra\.alarm\.MESSAGE=([^;]*)/);
  if(!m)return;
  e.preventDefault();
  P.setAlarm({hour:+m[1],minute:+m[2],message:decodeURIComponent(m[3])}).catch(()=>{});
});
const NP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.AlarmPlugin;
function syncAlarms(){
  if(!NP||!NP.scheduleAll)return;
  const L=[],now=Date.now(),d=new Date();d.setHours(0,0,0,0);
  for(let i=0;i<60;i++){
    const k=key(d),a=alarmOf(k);
    if(a){
      const p=a.tm.split(':').map(Number),t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),p[0],p[1],0,0).getTime();
      if(t>now)L.push({t:t,m:a.s.name+' '+a.tm+' ('+(isHol(k)?'휴일':'평일')+')'});
    }
    d.setDate(d.getDate()+1);
  }
  try{NP.scheduleAll({alarms:L}).catch(()=>{})}catch(e){}
}
if(NP){try{NP.requestNotif().catch(()=>{})}catch(e){}}
render();
syncAlarms();
</script>
</body></html>
